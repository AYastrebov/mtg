# Keeps this fork's divergence from 9seconds/mtg visible.
#
# The fork carries a multi-secret patch that upstream declined (#67), so it can
# never be merged away — the only way drift stays manageable is to see it early.
# RouteBox pins an exact commit of this branch and only moves that pin once the
# PR this opens is green.
name: sync-upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routebox-multi-secret
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/9seconds/mtg.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "nothing to merge"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B sync/upstream
          # A conflict is still worth a PR — it is the signal that the patched
          # files moved upstream, which is precisely what needs a human.
          if git merge --no-edit upstream/master; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "merge upstream/master (CONFLICTED - resolve by hand)"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.merge.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/upstream
          base: routebox-multi-secret
          title: "sync: merge upstream mtg master"
          body: |
            Automated upstream merge.

            Conflicts: ${{ steps.merge.outputs.conflicts }}

            The patched surface is `mtglib/proxy.go`, `mtglib/proxy_opts.go`,
            `mtglib/stream_context.go`, `mtglib/events.go` and
            `mtglib/internal/tls/fake/client_side.go`. If the conflict flag is
            true, the merge was committed unresolved and needs fixing by hand.

            Do not move RouteBox's `go.mod` pin until this is green.
